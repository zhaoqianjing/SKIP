
name: SKIP Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: skip-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 34
        run: |
          sdkmanager "platforms;android-34" \
                     "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --no-daemon --stacktrace

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk \
            release/SKIP-latest-debug.apk

          echo "short_sha=${GITHUB_SHA::7}" \
            >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SKIP-debug-${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}-${{ steps.apk.outputs.short_sha }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          gh release create "$TAG" \
            release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "SKIP Build $RUN_NUMBER" \
            --notes "Debug APK built from commit $SHA" \
            --prerelease
