
name: SKIP APK Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skip-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    defaults:
      run:
        shell: bash

    steps:
      # 1. 拉取当前分支的源码
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 2. 安装 JDK 17
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 3. 配置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. 安装项目需要的 SDK
      - name: Install Android SDK 34
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 5. 配置 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      # 6. 编译 Debug APK
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 7. 整理 APK 和版本信息
      - name: Prepare APK
        id: prepare
        run: |
          set -euo pipefail

          mkdir -p release

          mapfile -t APK_FILES < <(
            find app/build/outputs/apk/debug \
              -maxdepth 1 -type f -name '*.apk' \
              | sort
          )

          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_ID="${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TAG="build-${BUILD_ID}-${SHORT_SHA}"
          APK_NAME="SKIP-${TAG}-debug.apk"

          cp "${APK_FILES[0]}" "release/${APK_NAME}"

          sha256sum "release/${APK_NAME}" \
            > "release/${APK_NAME}.sha256"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

          ls -lh release/

      # 8. 保存 Actions 构建产物
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SKIP-APK-${{ github.run_number }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # 9. 自动创建 GitHub Release
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          APK_NAME: ${{ steps.prepare.outputs.apk_name }}
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_REPO: GuoXiCheng/SKIP
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          ## SKIP Unofficial Build

          This APK was built automatically from the current
          source code in this fork.

          - Source: ${SOURCE_REPO}
          - Commit: ${COMMIT_SHA}
          - Build: ${GITHUB_RUN_NUMBER}
          - Type: Debug APK
          - Signature: Android debug signing key

          This is an unofficial build, not an upstream
          official release.

          The SHA256 checksum is included in the assets.
          EOF

          gh release create "$TAG" \
            "release/${APK_NAME}" \
            "release/${APK_NAME}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "SKIP ${TAG}" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false

      # 10. 输出构建结果链接
      - name: Build Summary
        if: success()
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
          APK_NAME: ${{ steps.prepare.outputs.apk_name }}
        run: |
          echo "## SKIP APK Build Successful" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- APK: ${APK_NAME}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Commit: ${GITHUB_SHA}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            >> "$GITHUB_STEP_SUMMARY"
